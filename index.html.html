<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성호의 추억 Camera App</title>
    <style>
        /* 멋진 그라데이션 애니메이션 배경 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Malgun Gothic', sans-serif;
            color: white;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 90%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        /* 카메라 화면 뷰 */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 133.33%; /* 4:3 비율 */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 전면 카메라일 경우 좌우 반전 (후면은 스크립트에서 처리 가능) */
        }

        /* 버튼 스타일 */
        .btn-capture {
            margin-top: 20px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            border: 5px solid rgba(0, 0, 0, 0.1);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            position: relative;
        }

        .btn-capture:active {
            transform: scale(0.92);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn-capture::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border-radius: 50%;
            border: 2px solid #333;
        }

        /* 캔버스는 숨김 처리 */
        canvas {
            display: none;
        }

        /* 상태 메시지 */
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>성호의 추억 카메라</h2>
        <div class="video-wrapper">
            <video id="video" autoplay playsinline></video>
        </div>
        <button class="btn-capture" id="capture-btn" title="사진 촬영"></button>
        <div id="status">카메라 준비 중...</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const statusText = document.getElementById('status');

        // 1. 안드로이드 기기 카메라 스트림 가져오기
        async function initCamera() {
            try {
                // 후면 카메라(environment) 우선 시도, 안되면 전면(user)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
                statusText.innerText = "촬영 버튼을 누르면 자동 저장됩니다.";
            } catch (err) {
                console.error("카메라 접근 에러:", err);
                statusText.innerText = "카메라 권한을 허용해주세요.";
            }
        }

        // 2. 셔터 클릭 시 촬영 및 자동 다운로드(저장)
        captureBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            
            // 비디오 화면 크기에 맞춰 캔버스 크기 설정
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // 좌우 반전 상태인 비디오를 그대로 캔버스에 그리기 (필요 시 반전 해제 가능)
            context.translate(canvas.width, 0);
            context.scale(-1, 1);
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 캔버스 이미지를 DataURL(base64)로 변환
            const dataUrl = canvas.toDataURL('image/jpeg');
            
            // 가상 앵커(a) 태그를 생성하여 파일 자동 다운로드 트리거
            const downloadLink = document.createElement('a');
            const timestamp = new Date().toISOString().slice(0,19).replace(/[:T]/g, '_');
            
            downloadLink.href = dataUrl;
            downloadLink.download = `Captured_Photo_${timestamp}.jpg`; // 저장될 파일명
            
            // 기기 파일 시스템에 저장 트리거
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            
            // 화면 피드백 효과
            statusText.innerText = "사진이 다운로드 폴더에 저장되었습니다!";
            setTimeout(() => {
                statusText.innerText = "촬영 버튼을 누르면 자동 저장됩니다.";
            }, 2000);
        });

        // 페이지 로드 시 카메라 실행
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
